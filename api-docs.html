<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Order Management System - API Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet" />
    <style>
        .method-get { background-color: #10b981; }
        .method-post { background-color: #3b82f6; }
        .method-put { background-color: #f59e0b; }
        .method-patch { background-color: #8b5cf6; }
        .method-delete { background-color: #ef4444; }
        .dark .method-get { background-color: #059669; }
        .dark .method-post { background-color: #2563eb; }
        .dark .method-put { background-color: #d97706; }
        .dark .method-patch { background-color: #7c3aed; }
        .dark .method-delete { background-color: #dc2626; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">
    <div class="flex">
        <!-- Sidebar -->
        <div id="sidebar" class="w-64 bg-white dark:bg-gray-800 shadow-lg fixed h-full overflow-y-auto z-20 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out">
            <div class="p-6">
                <h1 class="text-2xl font-bold mb-4">API Docs</h1>
                <input type="text" id="search" placeholder="Search endpoints..." class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 mb-4">
                <nav id="nav">
                    <ul class="space-y-2"></ul>
                </nav>
            </div>
        </div>
        <!-- Overlay -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 lg:hidden hidden"></div>
        <!-- Main Content -->
        <div class="flex-1 lg:ml-64 p-8">
            <button id="toggle-sidebar" class="lg:hidden p-2 rounded-lg bg-gray-200 dark:bg-gray-700 mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <h1 class="text-4xl font-bold mb-8">Hotel Order Management API</h1>
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-blue-500 text-white p-6 rounded-xl shadow-lg">
                    <h2 class="text-2xl font-bold mb-2">Base URL</h2>
                    <code class="bg-white bg-opacity-20 px-3 py-1 rounded text-sm">http://localhost:3000/api</code>
                </div>
                <div class="bg-green-500 text-white p-6 rounded-xl shadow-lg">
                    <h2 class="text-2xl font-bold mb-2">Auth</h2>
                    <p class="text-sm">Bearer token in Authorization header</p>
                </div>
                <div class="bg-purple-500 text-white p-6 rounded-xl shadow-lg">
                    <h2 class="text-2xl font-bold mb-2">Rate Limited</h2>
                    <p class="text-sm">300 req/15min global, tighter for auth</p>
                </div>
            </div>
            <div id="content" class="mt-12 space-y-8"></div>
        </div>
    </div>

    <script>
        const apis = {
            root: {
                title: 'Root Endpoints',
                endpoints: [
                    { path: 'GET /', desc: 'Service status check', auth: 'No' },
                    { path: 'GET /healthz', desc: 'Health check with MongoDB status', auth: 'No' }
                ]
            },
            auth: {
                title: 'Authentication',
                endpoints: [
                    { method: 'POST', path: '/auth/register', desc: 'Register new user (admin creates staff)', auth: 'No', body: '{ "name": "string", "email": "email", "phone"?: "string", "password": "min6" }' },
                    { method: 'POST', path: '/auth/login', desc: 'Login with email/phone/password', auth: 'No', body: '{ "email"?: "email", "phone"?: "string", "password": "required" }' }
                ]
            },
            users: {
                title: 'Users (Admin only)',
                endpoints: [
                    { method: 'GET', path: '/users', desc: 'List users', auth: 'Admin' },
                    { method: 'GET', path: '/users/:id', desc: 'Get user by ID', auth: 'Admin' },
                    { method: 'POST', path: '/users', desc: 'Create user', auth: 'Admin', body: '{ "name": "req", "email": "email", "role": ["admin","waiter","kitchen"] }' },
                    { method: 'PUT', path: '/users/:id', desc: 'Update user', auth: 'Admin' },
                    { method: 'DELETE', path: '/users/:id', desc: 'Delete user', auth: 'Admin' }
                ]
            },
            menus: {
                title: 'Menu Items',
                endpoints: [
                    { method: 'GET', path: '/menus', desc: 'List menu items', auth: 'Yes' },
                    { method: 'GET', path: '/menus/:id', desc: 'Get menu item', auth: 'Yes' },
                    { method: 'POST', path: '/menus', desc: 'Create menu item (admin)', auth: 'Admin', body: '{ "name": "req", "price": "float>0", "category"?: "id" }' },
                    { method: 'PUT', path: '/menus/:id', desc: 'Update menu item (admin)', auth: 'Admin' },
                    { method: 'DELETE', path: '/menus/:id', desc: 'Delete menu item (admin)', auth: 'Admin' }
                ]
            },
            tables: {
                title: 'Tables',
                endpoints: [
                    { method: 'GET', path: '/tables', desc: 'List tables', auth: 'Yes' },
                    { method: 'GET', path: '/tables/:id', desc: 'Get table', auth: 'Yes' },
                    { method: 'POST', path: '/tables', desc: 'Create table (admin)', auth: 'Admin', body: '{ "tableNumber": "int>0" }' },
                    { method: 'PUT', path: '/tables/:id', desc: 'Update table (admin)', auth: 'Admin' },
                    { method: 'DELETE', path: '/tables/:id', desc: 'Delete table (admin)', auth: 'Admin' },
                    { method: 'PATCH', path: '/tables/:id/free', desc: 'Free table', auth: 'Admin/Waiter' }
                ]
            },
            orders: {
                title: 'Orders',
                endpoints: [
                    { method: 'GET', path: '/orders', desc: 'List orders', auth: 'Yes' },
                    { method: 'GET', path: '/orders/:id', desc: 'Get order', auth: 'Yes' },
                    { method: 'POST', path: '/orders', desc: 'Create order', auth: 'Admin/Waiter', body: '{ "table": "id", "items": [{ "menuItem": "id", "quantity": "int>0" }] }' },
                    { method: 'PUT', path: '/orders/:id', desc: 'Update order', auth: 'Admin/Waiter' },
                    { method: 'PATCH', path: '/orders/:id/status', desc: 'Update status (kitchen)', auth: 'Admin/Kitchen', body: '{ "status": ["pending","preparing","ready","served"] }' }
                ]
            },
            reports: {
                title: 'Reports (Admin)',
                endpoints: [
                    { method: 'GET', path: '/reports/summary', desc: 'Summary report', auth: 'Admin' },
                    { method: 'GET', path: '/reports/overview', desc: 'Overview report', auth: 'Admin' },
                    { method: 'GET', path: '/reports/analytics', desc: 'Analytics report', auth: 'Admin' },
                    { method: 'GET', path: '/reports/history', desc: 'Customer history', auth: 'Admin' },
                    { method: 'GET', path: '/reports/stock', desc: 'Stock report', auth: 'Admin' }
                ]
            },
            bills: {
                title: 'Bills',
                endpoints: [
                    { method: 'GET', path: '/bills/:id', desc: 'Generate bill PDF', auth: 'Admin/Waiter' },
                    { method: 'POST', path: '/bills/:id/pay', desc: 'Pay bill (admin)', auth: 'Admin', body: '{ "paymentMethod": ["cash","fonepay"] }' }
                ]
            },
            notifications: {
                title: 'Notifications',
                endpoints: [
                    { method: 'GET', path: '/notifications', desc: 'List notifications', auth: 'Yes' },
                    { method: 'PATCH', path: '/notifications/:id/read', desc: 'Mark single read', auth: 'Yes' },
                    { method: 'PATCH', path: '/notifications/read/all', desc: 'Mark all read', auth: 'Yes' }
                ]
            },
            profile: {
                title: 'Profile',
                endpoints: [
                    { method: 'GET', path: '/profile/me', desc: 'Get current user profile', auth: 'Yes' },
                    { method: 'GET', path: '/profile/waiter/analytics', desc: 'Waiter analytics', auth: 'Waiter' }
                ]
            },
            promotions: {
                title: 'Promotions',
                endpoints: [
                    { method: 'GET', path: '/promotions/me', desc: 'My promotions', auth: 'Yes' },
                    { method: 'GET', path: '/promotions/:id', desc: 'List promotions (admin)', auth: 'Admin' },
                    { method: 'POST', path: '/promotions/:id', desc: 'Add promotion (admin)', auth: 'Admin', body: '{ "title": "req", "effectiveDate": "ISO" }' }
                ]
            },
            inventory: {
                title: 'Inventory (Admin)',
                endpoints: [
                    { method: 'GET', path: '/inventory/ingredients', desc: 'List ingredients', auth: 'Admin' },
                    { method: 'POST', path: '/inventory/ingredients', desc: 'Create ingredient', auth: 'Admin' },
                    { method: 'PUT', path: '/inventory/ingredients/:id', desc: 'Update ingredient', auth: 'Admin' },
                    { method: 'POST', path: '/inventory/ingredients/:id/restock', desc: 'Restock', auth: 'Admin' },
                    { method: 'GET', path: '/inventory/transactions', desc: 'Stock transactions', auth: 'Admin' },
                    { method: 'POST', path: '/inventory/recipes', desc: 'Set recipe', auth: 'Admin' },
                    { method: 'GET', path: '/inventory/recipes/:menuItem', desc: 'Get recipe', auth: 'Admin' },
                    { method: 'GET', path: '/inventory/recipes', desc: 'List recipes', auth: 'Admin' }
                ]
            },
            guest: {
                title: 'Guest API (Limited)',
                endpoints: [
                    { method: 'GET', path: '/guest/menu', desc: 'Public menu', auth: 'No' },
                    { method: 'GET', path: '/guest/tables/:tableId/status', desc: 'Table status', auth: 'No' },
                    { method: 'POST', path: '/guest/orders', desc: 'Guest order', auth: 'No', body: '{ "table": "id", "items": [...] }' }
                ]
            },
            categories: {
                title: 'Categories (Admin)',
                endpoints: [
                    { method: 'GET', path: '/categories', desc: 'List', auth: 'Admin' },
                    { method: 'POST', path: '/categories', desc: 'Create', auth: 'Admin', body: '{ "name": "req" }' },
                    { method: 'PUT', path: '/categories/:id', desc: 'Update', auth: 'Admin' },
                    { method: 'DELETE', path: '/categories/:id', desc: 'Delete', auth: 'Admin' }
                ]
            },
            submenus: {
                title: 'Sub Menus (Admin)',
                endpoints: [
                    { method: 'GET', path: '/submenus', desc: 'List', auth: 'Admin' },
                    { method: 'POST', path: '/submenus', desc: 'Create', auth: 'Admin', body: '{ "name": "req" }' },
                    { method: 'PUT', path: '/submenus/:id', desc: 'Update', auth: 'Admin' },
                    { method: 'DELETE', path: '/submenus/:id', desc: 'Delete', auth: 'Admin' }
                ]
            },
            addons: {
                title: 'Add Ons (Admin)',
                endpoints: [
                    { method: 'GET', path: '/addons', desc: 'List', auth: 'Admin' },
                    { method: 'POST', path: '/addons', desc: 'Create', auth: 'Admin', body: '{ "name": "req", "price": "float>=0" }' },
                    { method: 'PUT', path: '/addons/:id', desc: 'Update', auth: 'Admin' },
                    { method: 'DELETE', path: '/addons/:id', desc: 'Delete', auth: 'Admin' }
                ]
            },
            combos: {
                title: 'Combo Offers (Admin)',
                endpoints: [
                    { method: 'GET', path: '/combos', desc: 'List combos', auth: 'Admin' },
                    { method: 'POST', path: '/combos', desc: 'Create combo', auth: 'Admin', body: '{ "name": "req", "items": [{menuItem, quantity, unitPrice}] }' },
                    { method: 'PUT', path: '/combos/:id', desc: 'Update', auth: 'Admin' },
                    { method: 'DELETE', path: '/combos/:id', desc: 'Delete', auth: 'Admin' }
                ]
            },
            public: {
                title: 'Public',
                endpoints: [
                    { method: 'GET', path: '/public/cafes/:slug', desc: 'Get cafe by slug', auth: 'No' }
                ]
            }
        };

        // Theme toggle
        if (localStorage.theme === 'dark' || (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        document.getElementById('toggle-theme')?.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });

        // Sidebar toggle
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const toggleBtn = document.getElementById('toggle-sidebar');
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });

        // Build nav and content
        const navUl = document.querySelector('#nav ul');
        const content = document.getElementById('content');
        const searchInput = document.getElementById('search');

        function render() {
            let html = '';
            let navHtml = '';
            Object.entries(apis).forEach(([key, group]) => {
                navHtml += `<li><a href="#${key}" class="block py-2 px-3 rounded hover:bg-gray-200 dark:hover:bg-gray-700">${group.title}</a></li>`;
                html += `<section id="${key}" class="group-section">
                    <h2 class="text-3xl font-bold mb-6 border-b pb-4">${group.title}</h2>
                    <div class="space-y-4">`;
                group.endpoints.forEach(ep => {
                    const methodClass = `method-${ep.method?.toLowerCase() || 'get'}`;
                    html += `
                        <div class="endpoint bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md border-l-4 border-blue-500 hover:shadow-xl transition-all">
                            <div class="flex items-center mb-4">
                                <span class="method-badge ${methodClass} text-white px-4 py-2 rounded font-mono font-bold text-sm mr-4">${ep.method || 'GET'}</span>
                                <code class="text-2xl font-mono flex-1">${ep.path}</code>
                            </div>
                            <p class="text-lg mb-4">${ep.desc}</p>
                            <div class="grid md:grid-cols-2 gap-4 text-sm">
                                <div><strong>Auth:</strong> <span class="bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded">${ep.auth}</span></div>
                                ${ep.body ? `<div><strong>Body:</strong><pre class="mt-1 p-2 bg-gray-100 dark:bg-gray-700 rounded text-xs overflow-auto">${ep.body}</pre></div>` : ''}
                            </div>
                        </div>`;
                });
                html += '</div></section>';
            });
            navUl.innerHTML = navHtml;
            content.innerHTML = html;

            // Smooth scroll for nav links
            document.querySelectorAll('#nav a').forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    document.querySelector(link.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                });
            });
        }

        // Search
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.endpoint').forEach(el => {
                const text = el.textContent.toLowerCase();
                el.style.display = text.includes(term) ? 'block' : 'none';
            });
            document.querySelectorAll('.group-section').forEach(section => {
                const visible = Array.from(section.querySelectorAll('.endpoint')).some(el => el.style.display !== 'none');
                section.style.display = visible ? 'block' : 'none';
            });
        });

        render();
    </script>
</body>
</html>
